name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all selenium --name SkinLandCharmScanner-V3 main.py

      - name: Copy config
        shell: pwsh
        run: |
          Copy-Item config.json dist\config.json

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\SkinLandCharmScanner-V3.exe,dist\config.json -DestinationPath SkinLandCharmScanner-V3-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkinLandCharmScanner-V3-Windows
          path: SkinLandCharmScanner-V3-Windows.zip
